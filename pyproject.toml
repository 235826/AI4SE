[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["keyring>=24", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
openai = ["openai>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
